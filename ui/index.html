<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charlie V2 UI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.1/socket.io.js"></script>
</head>
<body>
    <div class="glass-container">
        <h1 id="status-text">Idle</h1>
        
        <div class="orb-container">
            <div id="orb" class="orb idle"></div>
        </div>
        
        <p id="transcript">Waiting for command...</p>
        <p id="wakeword-hint" style="font-size: 0.8rem; color: #555; margin-top: 10px;">Say <b>"Hey Charlie"</b> to wake</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
